[project]
name = "products"
version = "0.1.0"
description = ""
authors = [
    {name = "Zach",email = "zachtvin@gmail.com"}
]
requires-python = ">=3.13,<3.14.1 || >3.14.1,<3.15"
dependencies = [
    "pyspark (>=4.1.1,<5.0.0)",
    "delta-spark (>=4.2.0,<5.0.0)",
    "mlflow (>=3.12.0,<4.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "torch (>=2.12.0,<3.0.0)",
    "streamlit (>=1.57.0,<2.0.0)",
    "datasets (>=4.8.5,<5.0.0)",
    "notebook (>=7.5.6,<8.0.0)",
    "faiss-cpu (>=1.14.2,<2.0.0)",
    "sentence-transformers (>=5.5.1,<6.0.0)",
    "rank-bm25 (>=0.2.2,<0.3.0)",
    "graphql-core (>=3.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "torchvision (>=0.27.1,<0.28.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
